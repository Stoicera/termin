# Lives in the public repo Stoicera/termin (created 2026-10-27).
# Builds Cal.diy from a pinned upstream commit into ghcr.io/stoicera/termin-cal:<commit>.
# Built in GitHub Actions, never on the app node: the upstream Dockerfile sets --max-old-space-size=6144.
# Checked 2026-10-21: calcom/cal.com redirects to calcom/cal.diy (MIT); main at 0f19cc46ef6b6426ee398c670575b3c96be7af9e
# (2026-10-19, 86 checks success, 14 skipped). The Dockerfile's first "ENV NEXT_PUBLIC_WEBAPP_URL=" is in the builder stage.
name: build-cal
on:
  workflow_dispatch:
    inputs:
      cal_ref:
        description: "calcom/cal.diy commit SHA (full)"
        required: true
        default: 0f19cc46ef6b6426ee398c670575b3c96be7af9e
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk (node_modules plus layers exceed the default free space)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v5
        with:
          repository: calcom/cal.diy
          ref: ${{ inputs.cal_ref }}
      - name: Close public signup at build time (NEXT_PUBLIC_* is inlined by Next.js)
        run: |
          sed -i '0,/^ENV NEXT_PUBLIC_WEBAPP_URL=/s//ENV NEXT_PUBLIC_DISABLE_SIGNUP=true\nENV NEXT_PUBLIC_WEBAPP_URL=/' Dockerfile
          grep -n 'NEXT_PUBLIC_DISABLE_SIGNUP' Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/stoicera/termin-cal:${{ inputs.cal_ref }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://termin.stoicera.com
            NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL=https://stoicera.com/datenschutz
            NEXT_PUBLIC_WEBSITE_TERMS_URL=https://stoicera.com/impressum
            CALCOM_TELEMETRY_DISABLED=1
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/stoicera/termin-cal:${{ inputs.cal_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"              # report on the first run; decide on a gate after reading it
